name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release

    steps:
      # Actions are pinned to commit SHAs (a tag can be moved to malicious code)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      # No dependency cache: a release is built only from the lockfile and the registry
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix webview

      - name: Verify registry signatures and provenance
        run: |
          npm audit signatures
          cd webview && npm audit signatures

      - name: Test
        run: npm test

      - name: Build and package extension
        run: npm run package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: '*.vsix'
          generate_release_notes: true
