name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write # create the GitHub Release

    steps:
      # Actions are pinned to commit SHAs (a tag can be moved to malicious code)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # No dependency cache: a release is built only from the lockfile and the registry
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix webview

      - name: Verify registry signatures and provenance
        run: |
          npm audit signatures
          cd webview && npm audit signatures

      - name: Test
        run: npm test

      - name: Build and package extension
        run: npm run package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: '*.vsix'
          generate_release_notes: true
