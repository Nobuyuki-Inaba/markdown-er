name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: nothing in CI needs to write to the repository
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (a tag can be moved to malicious code)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # npm ci installs exactly the lockfile (integrity-checked); .npmrc disables install scripts
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix webview

      - name: Verify registry signatures and provenance
        run: |
          npm audit signatures
          cd webview && npm audit signatures

      # Shipped code (dependencies) must have no known high-severity vulnerability;
      # build tools (devDependencies) fail only on critical ones
      - name: Audit
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
          cd webview
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical

      - name: Type-check
        run: |
          npx tsc --noEmit
          cd webview && npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
